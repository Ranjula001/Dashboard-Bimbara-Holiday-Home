[build.environment]
  # The Supabase URL and publishable key are public by design (protected by RLS)
  # and Next.js inlines NEXT_PUBLIC_* values into the client bundle, so exclude
  # them from Netlify's secrets scanning. Never add secret keys here.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
